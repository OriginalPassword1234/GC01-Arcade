name: GC01 Rider v2.9 - two-file build (75 KiB)
permissions:
  contents: read
jobs:
  firmware-candidate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
    - name: Checkout repository (workflow and source ZIP)
      uses: actions/checkout@v4
    - name: Identify v2.9 workflow revision
      shell: bash
      run: |
        set -euo pipefail
        echo '=== RIDER_V29_75K_TWO_FILE - FRESH RUN ==='
        echo "Commit: ${GITHUB_SHA}"
        echo "Workflow: ${GITHUB_WORKFLOW_REF}"
        echo '75 KiB firmware, 34 KiB history; require 300 B flash reserve and 3328 B nominal SRAM headroom.'
        echo 'Flash fit before full gameplay tests; cache only clean dependencies and original fonts.'
    - name: Restore pristine Rad Pro Git cache
      uses: actions/cache/restore@v4
      id: radpro_cache
      continue-on-error: true
      with:
        path: radpro/.git
        key: rider-radpro-git-v1-${{ runner.os }}-${{ runner.arch }}-a9d0f19
    - name: Prepare pinned Rad Pro 3.1.1 source (retry and cache)
      shell: bash
      run: |
        set -euo pipefail
        if test -d radpro/.git; then
          if ! git -C radpro rev-parse --verify 'a9d0f19^{commit}' >/dev/null 2>&1; then
            rm -rf -- radpro
          fi
        fi
        if ! test -d radpro/.git; then
          ok=0
          for attempt in 1 2 3; do
            echo "Rad Pro download attempt $attempt/3"
            if git -c http.version=HTTP/1.1 clone --no-checkout --progress https://github.com/Gissio/radpro.git radpro; then
              ok=1; break
            fi
            rm -rf -- radpro
            sleep "$((attempt*3))"
          done
          test "$ok" = 1
        fi
        git -C radpro checkout --force --detach a9d0f19
        git -C radpro reset --hard a9d0f19
        git -C radpro clean -ffdx
        expected=$(git -C radpro rev-parse 'a9d0f19^{commit}')
        test "$(git -C radpro rev-parse HEAD)" = "$expected"
        test -f radpro/tools/sign.py
        echo "Verified pinned Rad Pro commit: $expected"
    - name: Save pristine Rad Pro Git cache
      uses: actions/cache/save@v4
      if: steps.radpro_cache.outputs.cache-hit != 'true'
      continue-on-error: true
      with:
        path: radpro/.git
        key: rider-radpro-git-v1-${{ runner.os }}-${{ runner.arch }}-a9d0f19
    - name: Verify and extract Rider v2.9 source ZIP; install 75 KiB layout
      shell: bash
      run: |
        set -Eeuo pipefail
        mkdir -p dist/tests
        trap 'rc=$?; printf "Overlay install failed: exit %s, script line %s, command: %.240s\n" "$rc" "$LINENO" "$BASH_COMMAND" | tee -a dist/tests/OVERLAY_INSTALL_ERROR.txt >&2; exit "$rc"' ERR
        # Only two committed files are required: this workflow and the source ZIP.
        test -s rider-v29-source.zip
        printf '%s  %s\n' 'fcdddee53c2c22d66e067dff61867c2107307052055bd3a4b1df3034761d635f' 'rider-v29-source.zip' | sha256sum -c -
        source_dir=$(mktemp -d)
        python3 -m zipfile -e rider-v29-source.zip "$source_dir"
        (cd "$source_dir" && sha256sum -c RIDER_SOURCE_SHA256SUMS.txt)
        mkdir -p radpro/rider_ci radpro/overlay
        cp -a "$source_dir/rider_ci/." radpro/rider_ci/
        cp -a "$source_dir/overlay/." radpro/overlay/
        rm -rf -- "$source_dir"
        # Browser uploads may not preserve executable bits.
        chmod +x radpro/rider_ci/compare_build_v28.sh
        chmod +x radpro/rider_ci/select_size_profile.sh
        chmod +x radpro/rider_ci/tests/run.sh
        chmod +x radpro/rider_ci/tests/run_compact_lossless.sh
        chmod +x radpro/rider_ci/tests/run_datalog_v28.sh
        chmod +x radpro/rider_ci/tests/run_lossless.sh
        chmod +x radpro/rider_ci/tests/run_optimized_local.sh
        echo 'RIDER_V29_75K_20261125 verified source ZIP installed.'
        # Keep CI source paths aligned with the embedded tarball layout.
        # The save module is in rider_ci/, NOT rider_ci/src/.
        for required in \
            rider_ci/src/rider_core.c rider_ci/src/rider_core.h \
            rider_ci/src/rider_render.c rider_ci/src/rider_render.h \
            rider_ci/rider_saves.c rider_ci/rider_saves.h \
            rider_ci/tests/run.sh rider_ci/tests/render_scenes.c \
            rider_ci/tests/bench_loop.c rider_ci/tests/flash_sim/test_saves.c \
            rider_ci/tests/test_v09.c rider_ci/tests/test_core.c \
            rider_ci/tests/test_visual_v09.c \
            rider_ci/tests/test_v10.c rider_ci/tests/test_v11.c \
            rider_ci/tests/test_reference_repairs.c rider_ci/tests/test_v12.c rider_ci/tests/test_v13.c rider_ci/tests/test_v14.c rider_ci/tests/test_v15.c rider_ci/tests/test_v16.c rider_ci/tests/test_v17.c rider_ci/tests/render_audit.c rider_ci/tests/render_run.c \
            rider_ci/README_V17.md rider_ci/README_V18.md rider_ci/README_V19.md rider_ci/README_V20.md rider_ci/README_V21.md rider_ci/tests/test_v21.c rider_ci/tests/test_lcd_extended.c rider_ci/tests/test_v18.c rider_ci/tests/test_v19.c rider_ci/tests/test_v20.c rider_ci/tests/render_timing.c rider_ci/tests/render_motion.c \
            overlay/platform.io/src/extras/rider_app.c \
            overlay/platform.io/src/extras/rider_saves.c \
            overlay/platform.io/src/extras/rider_saves.h \
            overlay/platform.io/src/ui/rider_screen.c \
            overlay/platform.io/src/ui/rider_render.h; do
          test -s "radpro/$required" || { echo "Bundled source is missing: $required" >&2; exit 1; }
        done
        cmp radpro/rider_ci/src/rider_render.c radpro/overlay/platform.io/src/ui/rider_render.c
        cmp radpro/rider_ci/src/rider_core.c radpro/overlay/platform.io/src/extras/rider_core.c
        cmp radpro/rider_ci/src/rider_core.h radpro/overlay/platform.io/src/extras/rider_core.h
        cmp radpro/rider_ci/rider_screen.c radpro/overlay/platform.io/src/ui/rider_screen.c
        test -s radpro/rider_ci/tests/test_v09.c
        echo 'Verified save file root: radpro/rider_ci/rider_saves.c'
        cmp radpro/rider_ci/rider_saves.c radpro/overlay/platform.io/src/extras/rider_saves.c
        grep -q 'case EVENT_HEARTBEAT' radpro/overlay/platform.io/src/extras/rider_app.c
        grep -q 'requestBacklightTrigger' radpro/overlay/platform.io/src/extras/rider_app.c
        grep -q '^#define STRIP_ROWS 2$' radpro/rider_ci/src/rider_render.c
        grep -Fq 'static uint8_t facet[W/4];' radpro/rider_ci/src/rider_render.c
        grep -q '^MIN_STACK_HEADROOM = 3328' radpro/rider_ci/verify_expanded.py
        echo 'v2.9: renderer 2421 B, snapshot 24 B, 960 B checksum cache; nominal SRAM threshold 3328 B.'
        test -d radpro/platform.io/src || { echo 'Pinned Rad Pro source tree missing platform.io/src' >&2; exit 1; }
        echo 'Installing verified overlay into pinned Rad Pro source tree.'
        cp -a radpro/overlay/platform.io/src/. radpro/platform.io/src/
        # Header-path regression: the renderer lives in ui/ but the Rider
        # physics header lives in extras/. Fail BEFORE the ARM compile if
        # the source bundle ever reintroduces the missing-header bug.
        test -s radpro/platform.io/src/extras/rider_core.h
        grep -Fq '#include "../extras/rider_core.h"' radpro/platform.io/src/ui/rider_render.h
        echo 'PASS: firmware renderer header uses extras/rider_core.h via relative include.'
        printf '#include "rider_render.h"\n#include "rider_screen.h"\nint main(void) { return 0; }\n' | gcc -std=c11 -Wall -Wextra -Werror -DGC01_RIDER -Iradpro/platform.io/src/ui -x c -fsyntax-only -
        gcc -std=c11 -Wall -Wextra -Werror -DGC01_RIDER -fsyntax-only radpro/platform.io/src/ui/rider_render.c
        echo 'PASS: installed firmware renderer and screen headers compile with no host include path.'
        python3 radpro/rider_ci/apply_expanded_layout.py
        python3 radpro/rider_ci/test_expanded_layout.py | tee dist/tests/LAYOUT_75K_TEST.txt
        python3 radpro/rider_ci/install_datalog_v28.py | tee dist/tests/DATALOG_INSTALL.txt
        cmp radpro/rider_ci/datalog_v28.c radpro/platform.io/src/measurements/datalog.c
        (cd radpro/rider_ci && CC=gcc bash tests/run_datalog_v28.sh) | tee dist/tests/DATALOG_GCC.txt
        (cd radpro/rider_ci && CC=clang bash tests/run_datalog_v28.sh) | tee dist/tests/DATALOG_CLANG.txt
        echo 'PASS: v2.9 overlay install and layout checks completed.'

        for f in rider_ci/select_size_profile.sh rider_ci/preflight_profile.py rider_ci/tests/test_lossless.c rider_ci/tests/run_lossless.sh rider_ci/README_V22.md; do test -s "radpro/$f"; done
    - name: Install PlatformIO and original font-building tools
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install platformio pyelftools freetype-py bdflib
    - name: Fingerprint font and compiler cache inputs
      shell: bash
      id: keys
      run: |
        set -euo pipefail
        commit=$(git -C radpro rev-parse HEAD)
        font_key=$(
          {
            echo "$commit"
            python3 --version
            python3 -c 'import importlib.metadata as m; import freetype; print(m.version("freetype-py"),m.version("bdflib"),freetype.version())'
            find radpro/fonts radpro/tools radpro/platform.io/src/system/strings -type f ! -name '*.pyc' ! -path '*/__pycache__/*' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          } | sha256sum | cut -d' ' -f1
        )
        pio_key=$(
          { echo "$commit"; python3 -m platformio --version; sha256sum radpro/platform.io/platformio.ini; } | sha256sum | cut -d' ' -f1
        )
        old_pio_key=$(
          { echo "$commit"; python3 -m platformio --version; printf '%s  radpro/platform.io/platformio.ini\n' "$(sed 's/-DFIRMWARE_SIZE=0x12c00/-DFIRMWARE_SIZE=0x12800/' radpro/platform.io/platformio.ini | sha256sum | cut -d' ' -f1)"; } | sha256sum | cut -d' ' -f1
        )
        printf 'font=%s\npio=%s\nold_pio=%s\n' "$font_key" "$pio_key" "$old_pio_key" >> "$GITHUB_OUTPUT"
    - name: Restore original generated fonts
      uses: actions/cache/restore@v4
      id: font_cache
      continue-on-error: true
      with:
        path: |-
          radpro/platform.io/src/ui/fonts
          radpro/.rider-fonts.sha256
        key: rider-full-fonts-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.font }}
    - name: Verify cached fonts or generate original Rad Pro fonts
      shell: bash
      run: |
        set -euo pipefail
        test -f radpro/fonts/RadPro-Symbols.ttf
        fontdir=radpro/platform.io/src/ui/fonts
        manifest=radpro/.rider-fonts.sha256
        write_manifest() {
          find "$fontdir" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
        }
        if test -s "$manifest" && test -s "$fontdir/font_small_en_color_21.h" && test -s "$fontdir/font_medium_en_color_32.h" && cmp -s "$manifest" <(write_manifest); then
          echo 'FONT CACHE HIT: all cached font bytes match the manifest.'
        else
          echo 'FONT CACHE MISS: generating the unmodified original Rad Pro fonts.'
          (cd radpro/tools && python3 build-fonts.py)
          write_manifest > "$manifest"
        fi
        test -s "$fontdir/font_small_en_color_21.h"
        test -s "$fontdir/font_medium_en_color_32.h"
        test -s "$manifest"
        sha256sum -c "$manifest" > dist/tests/FONT_INTEGRITY.txt
    - name: Save fonts now, even if later flash fitting fails
      uses: actions/cache/save@v4
      if: steps.font_cache.outputs.cache-hit != 'true'
      continue-on-error: true
      with:
        path: |-
          radpro/platform.io/src/ui/fonts
          radpro/.rider-fonts.sha256
        key: rider-full-fonts-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.font }}
    - name: Restore ARM compiler and PlatformIO platform packages
      uses: actions/cache/restore@v4
      id: pio_cache
      continue-on-error: true
      with:
        path: |-
          ~/.platformio/packages
          ~/.platformio/platforms
        key: rider-pio-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.pio }}
        restore-keys: |
          rider-pio-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.pio }}
          rider-pio-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.old_pio }}
    - name: FIRST GATE - require 75 KiB fit, 300 B flash reserve and improved RAM
      shell: bash
      run: |
        set -euo pipefail
        cd radpro
        export RIDER_V29_MAX_BYTES=76496
        printf "%s\n" "$RIDER_V29_MAX_BYTES" > "$GITHUB_WORKSPACE/dist/tests/V29_MAX_BYTES.txt"
        bash rider_ci/select_size_profile.sh
        raw=platform.io/.pio/build/fnirsi-gc01_apm32f103rb-en/firmware.bin
        bytes=$(wc -c < "$raw")
        test "$bytes" -le "$RIDER_V29_MAX_BYTES"
        printf "Target cap: %s B; v2.9: %s B; spare after CRC: %s B; reduction vs v2.8 best: %s B\n" "$RIDER_V29_MAX_BYTES" "$bytes" "$((76796-bytes))" "$((76836-bytes))" | tee "$GITHUB_WORKSPACE/dist/tests/FLASH_BUDGET.txt"
        sha256sum -c "$GITHUB_WORKSPACE/dist/tests/size/SELECTED_BUILD_HASHES.txt"
      id: compile
    - name: Check whether ARM dependencies completed a usable compilation
      shell: bash
      id: cacheable
      if: ${{ !cancelled() && steps.pio_cache.outputs.cache-hit != 'true' && (steps.compile.outcome == 'success' || steps.compile.outcome == 'failure') }}
      run: |
        set -euo pipefail
        report=dist/tests/size/SIZE_RESULTS.tsv
        if test -s "$report" && awk -F '\t' '$2=="fits" || $2=="oversize" || $2=="insufficient_sram" || $2=="above_target" {ok=1} END {exit !ok}' "$report" && test -d "$HOME/.platformio/packages" && test -d "$HOME/.platformio/platforms"; then
          echo 'ok=true' >> "$GITHUB_OUTPUT"
        else
          echo 'ok=false' >> "$GITHUB_OUTPUT"
        fi
    - name: Save successfully used ARM compiler dependencies
      uses: actions/cache/save@v4
      if: ${{ !cancelled() && steps.cacheable.outputs.ok == 'true' && steps.pio_cache.outputs.cache-hit != 'true' }}
      continue-on-error: true
      with:
        path: |-
          ~/.platformio/packages
          ~/.platformio/platforms
        key: rider-pio-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.keys.outputs.pio }}
    - name: Run complete GCC and Clang sanitizer and differential suites in parallel
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$GITHUB_WORKSPACE/dist/tests" "$GITHUB_WORKSPACE/dist/previews"
        cd radpro/rider_ci
        report="$GITHUB_WORKSPACE/dist/tests"
        work=$(mktemp -d /tmp/rider-fast.XXXXXXXX)
        gcc_script=$(mktemp tests/.run-fast-gcc.XXXXXXXX.sh)
        clang_script=$(mktemp tests/.run-fast-clang.XXXXXXXX.sh)
        trap 'rm -f -- "$gcc_script" "$clang_script"; rm -rf -- "$work"' EXIT
        mkdir -p "$work/gcc" "$work/clang"
        # The original run.sh uses fixed /tmp/rider_* paths. Only redirect those
        # filenames in temporary launchers; preserve every compiler flag and test.
        sed "s|/tmp/rider_|$work/gcc/rider_|g" tests/run.sh > "$gcc_script"
        sed "s|/tmp/rider_|$work/clang/rider_|g" tests/run.sh > "$clang_script"
        # Prove the temporary launchers differ only in the location of scratch files.
        sed "s|$work/gcc/rider_|/tmp/rider_|g" "$gcc_script" | cmp - tests/run.sh
        sed "s|$work/clang/rider_|/tmp/rider_|g" "$clang_script" | cmp - tests/run.sh
        (
          set -euo pipefail
          {
            echo 'GCC / AddressSanitizer / UndefinedBehaviorSanitizer / gameplay tests'
            echo "Git commit: $GITHUB_SHA"
            gcc --version | head -n 1
            CC=gcc bash "$gcc_script"
            echo 'GCC host tests: PASS'
          } 2>&1 | tee "$report/GCC_TEST_RESULTS.txt"
          CC=gcc bash tests/run_lossless.sh 2>&1 | tee "$report/LOSSLESS_GCC.txt"
        ) &
        gcc_pid=$!
        (
          set -euo pipefail
          {
            echo 'Clang / AddressSanitizer / UndefinedBehaviorSanitizer'
            clang --version | head -n 1
            CC=clang bash "$clang_script"
            echo 'Clang host tests: PASS'
          } 2>&1 | tee "$report/CLANG_TEST_RESULTS.txt"
          CC=clang bash tests/run_lossless.sh 2>&1 | tee "$report/LOSSLESS_CLANG.txt"
          CC=clang bash tests/run_compact_lossless.sh 2>&1 | tee "$report/COMPACT_LOSSLESS_CLANG.txt"
        ) &
        clang_pid=$!
        gcc_rc=0; clang_rc=0
        wait "$gcc_pid" || gcc_rc=$?
        wait "$clang_pid" || clang_rc=$?
        printf 'GCC exit=%s; Clang exit=%s\n' "$gcc_rc" "$clang_rc"
        if ((gcc_rc != 0 || clang_rc != 0)); then
          echo 'At least one full test suite failed; no firmware will be published.' >&2
          exit 1
        fi
    - name: Run original rendering benchmarks and 300-frame QA
      shell: bash
      run: |
        set -euo pipefail
        cd radpro/rider_ci
        gcc -std=c11 -O2 -Wall -Wextra -Werror src/rider_core.c src/rider_render.c tests/host_render_benchmark.c -o /tmp/rider_v09_host_bench
        /tmp/rider_v09_host_bench | tee "$GITHUB_WORKSPACE/dist/tests/HOST_RENDER_BENCHMARK.txt"
        gcc -std=c11 -O2 -Wall -Wextra -Werror src/rider_core.c src/rider_render.c tests/bench_loop.c -o /tmp/rider_v09_loop_bench
        /tmp/rider_v09_loop_bench | tee "$GITHUB_WORKSPACE/dist/tests/LOOP_RENDER_BENCHMARK.txt"
        gcc -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined -no-pie src/rider_core.c src/rider_render.c tests/render_audit.c -o /tmp/rider_v17_qa
        /tmp/rider_v17_qa | tee "$GITHUB_WORKSPACE/dist/tests/LIVE_300_FRAME_QA.txt"
    - name: Produce preview images using the SAME tested C renderer
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p dist/previews dist/tests
        scenes=(referencecurl curlexit referencedrop arc gap risegap highgap moving falling giantsaw sawvalley wall bowl perfect ring lift twosaws twopads timedspikes splitbowl slopeup slopedown openloop score spikes triangle detachedbowl)
        {
          gcc -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined -no-pie radpro/rider_ci/src/rider_core.c radpro/rider_ci/src/rider_render.c radpro/rider_ci/tests/render_run.c -o /tmp/rider_v18_live_preview
          for scene in "${scenes[@]}"; do
            echo "Rendering $scene"
            ASAN_OPTIONS=detect_leaks=1 /tmp/rider_v18_live_preview "$scene" "$GITHUB_WORKSPACE/dist/previews/$scene.ppm"
          done
        } 2>&1 | tee dist/tests/PREVIEW_RESULTS.txt
        # Convert raw PPM screenshots to PNG using Python's standard library.
        # A pure conversion: no AI-generated or altered screenshots.
        python3 - "${scenes[@]}" <<'PYPNG'
        import struct, zlib, sys
        from pathlib import Path
        folder=Path('dist/previews')
        scenes=sys.argv[1:]
        if len(scenes)!=len(set(scenes)) or not scenes:
            raise RuntimeError(f'Invalid preview scene list: {scenes}')
        expected_ppm={f'{scene}.ppm' for scene in scenes}
        expected_png={f'{scene}.png' for scene in scenes}
        actual_ppm={p.name for p in folder.glob('*.ppm') if p.is_file()}
        if actual_ppm!=expected_ppm:
            raise RuntimeError(f'PPM set mismatch: missing={sorted(expected_ppm-actual_ppm)}, extra={sorted(actual_ppm-expected_ppm)}')
        def chunk(t, payload):
            return struct.pack('>I',len(payload))+t+payload+struct.pack('>I',zlib.crc32(t+payload)&0xffffffff)
        for src in sorted(folder.glob('*.ppm')):
            buf=src.read_bytes()
            hdr=b'P6\n320 240\n255\n'
            if not buf.startswith(hdr): raise RuntimeError(f'Unexpected PPM header: {src}')
            rgb=buf[len(hdr):]
            if len(rgb)!=320*240*3: raise RuntimeError(f'Unexpected frame size: {src}, {len(rgb)} bytes')
            raw=b''.join(b'\x00'+rgb[row*320*3:(row+1)*320*3] for row in range(240))
            png=b'\x89PNG\r\n\x1a\n'
            png+=chunk(b'IHDR',struct.pack('>IIBBBBB',320,240,8,2,0,0,0))
            png+=chunk(b'IDAT',zlib.compress(raw,6))
            png+=chunk(b'IEND',b'')
            src.with_suffix('.png').write_bytes(png)
            src.unlink()
            print('Generated',src.with_suffix('.png'))
        actual_png={p.name for p in folder.glob('*.png') if p.is_file() and p.stat().st_size>0}
        if actual_png!=expected_png:
            raise RuntimeError(f'PNG set mismatch: missing={sorted(expected_png-actual_png)}, extra={sorted(actual_png-expected_png)}')
        print(f'Validated all {len(expected_png)} expected PNG previews.')
        PYPNG
    - name: Generate official Rad Pro-style CRC update image
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p dist/tests
        # The upstream signer can skip oversized binaries and still return 0.
        # Keep the audited 75 KiB partition and reserve 4-byte CRC plus 300 B.
        (
          set -euo pipefail
          cd radpro
          RAW=platform.io/.pio/build/fnirsi-gc01_apm32f103rb-en/firmware.bin
          ELF=platform.io/.pio/build/fnirsi-gc01_apm32f103rb-en/firmware.elf
          SIGNED=fnirsi-gc01_apm32f103rb/firmware/radpro-fnirsi-gc01_apm32f103rb-en-3.1.1.bin
          test -s "$RAW" && test -s "$ELF" || { echo 'ERROR: target raw binary or ELF missing'; exit 1; }
          target=$(cat ../dist/tests/V29_MAX_BYTES.txt)
          test "$(wc -c < "$RAW")" -le "$target" || { echo "ERROR: firmware exceeds v2.9 target"; exit 1; }
          python3 - "$RAW" "$ELF" <<'PY'
        import pathlib, sys
        sys.path.insert(0, 'rider_ci')
        from verify_expanded import APP_SIZE, APP_BASE, SETTINGS_BASE, SETTINGS_SIZE, LOG_BASE, LOG_SIZE, extract_metadata
        raw, elf = map(pathlib.Path, sys.argv[1:])
        size = raw.stat().st_size
        limit = APP_SIZE - 4 - 300
        print(f'Raw firmware: {size} bytes; maximum payload: {limit} bytes; remaining: {limit-size} bytes', flush=True)
        if size > limit:
            raise SystemExit(f'ERROR: firmware exceeds the 75 KiB payload target with 300 B reserve by {size-limit} bytes. Do not enlarge further or truncate the binary.')
        if size < 0x28:
            raise SystemExit('ERROR: raw firmware is too short for the settings header')
        _, meta = extract_metadata(elf)
        print(f'ELF layout metadata: {meta}', flush=True)
        expected = dict(FLASH_BASE=0x08000000, FLASH_SIZE=0x20000, FIRMWARE_BASE=APP_BASE, FIRMWARE_SIZE=APP_SIZE, STATES_BASE=SETTINGS_BASE, STATES_SIZE=SETTINGS_SIZE, DATALOG_BASE=LOG_BASE, DATALOG_SIZE=LOG_SIZE)
        if any(meta.get(k) != v for k,v in expected.items()):
            raise SystemExit('ERROR: ELF metadata does not match the audited partition layout; refusing to sign.')
        PY
          # Remove only the exact expected output, so a stale image cannot pass.
          rm -f -- "$SIGNED"
          python3 tools/sign.py
          if ! test -s "$SIGNED"; then
            echo "ERROR: Rad Pro signer returned without producing $SIGNED"
            echo 'Firmware version in source:'
            grep '^#define FIRMWARE_VERSION ' platform.io/src/system/system.h || true
            echo 'Files actually produced by the signer:'
            if test -d fnirsi-gc01_apm32f103rb/firmware; then
              find fnirsi-gc01_apm32f103rb/firmware -maxdepth 1 -type f -printf '%f %s bytes\n'
            fi
            exit 1
          fi
          echo "PASS: signed image created: $SIGNED ($(wc -c < "$SIGNED") bytes)"
        ) 2>&1 | tee dist/tests/SIGNING_LOG.txt
        cp dist/tests/SIGNING_LOG.txt /tmp/rider_expanded_sign.log
    - name: Audit CRC, vectors, flash partitions and at least 3328 B spare SRAM
      shell: bash
      run: |
        set -euo pipefail
        cd radpro
        RAW=platform.io/.pio/build/fnirsi-gc01_apm32f103rb-en/firmware.bin
        ELF=platform.io/.pio/build/fnirsi-gc01_apm32f103rb-en/firmware.elf
        SIGNED=fnirsi-gc01_apm32f103rb/firmware/radpro-fnirsi-gc01_apm32f103rb-en-3.1.1.bin
        test -s "$SIGNED" || { echo "ERROR: expected signed image missing: $SIGNED" >&2; exit 1; }
        python3 rider_ci/verify_expanded.py "$RAW" "$ELF" "$SIGNED" 2>&1 | tee /tmp/rider_expanded_audit.log
        mkdir -p ../dist/source
        cp rider_ci/src/rider_core.c rider_ci/src/rider_core.h rider_ci/src/rider_render.c rider_ci/src/rider_render.h ../dist/source/
        cp rider_ci/README_V19.md rider_ci/README_V20.md rider_ci/README_V21.md ../dist/source/
        printf 'ARM nominal headroom must be >= 3328 bytes; renderer arrays are 2421 B and hash cache 960 B.\n' > ../dist/tests/V17_RAM_NOTES.txt
        cp rider_ci/rider_saves.c rider_ci/rider_saves.h overlay/platform.io/src/extras/rider_app.c ../dist/source/
        cp rider_ci/README_V25.md ../dist/source/README_V25.md
        cp rider_ci/README_V26.md ../dist/source/README_V26.md
        cp rider_ci/README_V29.md ../dist/source/README.md
        cp rider_ci/README_V28.md ../dist/source/README_V28.md
        cp -a rider_ci/local_verification ../dist/source/
        cp rider_ci/datalog_v28.c rider_ci/tests/test_datalog_v27.c rider_ci/tests/test_minute_v28.c rider_ci/tests/test_fault_v28.c rider_ci/tests/test_datalog_storage.c rider_ci/tests/datalog_shim.h rider_ci/tests/run_datalog_v28.sh rider_ci/install_datalog_v28.py rider_ci/apply_expanded_layout.py rider_ci/test_expanded_layout.py rider_ci/verify_expanded.py rider_ci/rider_screen.c ../dist/source/
        cp rider_ci/tools/check_mixed_abi.c rider_ci/tools/compact_backend.py rider_ci/tests/run_compact_lossless.sh ../dist/source/
        cp rider_ci/tests/test_lossless.c rider_ci/tests/run_lossless.sh rider_ci/select_size_profile.sh rider_ci/preflight_profile.py ../dist/source/
        cp -a rider_ci/tests/reference_v21a ../dist/source/
        cp rider_ci/tests/test_v11.c ../dist/source/test_v11.c
        cp rider_ci/tests/test_reference_repairs.c rider_ci/tests/test_v12.c rider_ci/tests/test_v13.c rider_ci/tests/test_v14.c rider_ci/tests/test_v15.c rider_ci/tests/test_v16.c rider_ci/tests/test_v17.c rider_ci/tests/test_v18.c rider_ci/tests/test_v19.c rider_ci/tests/test_v20.c rider_ci/tests/render_timing.c rider_ci/tests/render_audit.c rider_ci/tests/render_run.c ../dist/source/
        cp rider_ci/tests/test_v21.c rider_ci/tests/test_lcd_extended.c ../dist/source/
        cp "$SIGNED" ../dist/GC01_RIDER_V29_75K_APM32_DO_NOT_FLASH.bin
        cp "$ELF" ../dist/GC01_RIDER_V29_75K_APM32_DIAGNOSTIC.elf
        cp /tmp/rider_expanded_audit.log ../dist/ADDRESS_AND_MEMORY_AUDIT.txt
        cat > ../dist/READ_BEFORE_FLASHING.txt <<'TXT'
        EXPERIMENTAL GC01 APM32 FLASH IMAGE; DO NOT FLASH. NOT HARDWARE VALIDATED.
        16 KiB original bootloader / 75 KiB firmware / 2 KiB game score journal
        / 1 KiB moved settings / 34 KiB moved radiation log.

        34 KiB physical log (one page smaller than v2.8). Adaptive minute-page format and legacy short-interval packing. Export before downgrading. Up to three pending minutes (or three one-second/two ten-second samples) may be lost on sudden power loss. Closed minute pages use CRC16; open pages are not fully CRC-protected. Physical torn writes remain unverified. Logging fault stops writer until reboot; export can end at rollover.
        Renderer uses 2-row RGB565 strips with 2421 B static arrays, plus
        a 960 B two-tile 32-bit checksum cache. Full frame may require 120 rather than 80 transfers. ST7789 uses a parallel GPIO bus on
        the GC01, not SPI. Skips unchanged tiles; periodic refresh repairs stale pixels.
        On-device frame rate is UNMEASURED for v2.1 (user saw ~20 FPS in an earlier build).
        This build intentionally does NOT migrate the old calibration and history.
        Old settings, cumulative readings, radiation records and Rider saves MAY BE LOST.
        A successful CRC, ELF check or GitHub build CANNOT prove the USB bootloader
        accepts the expanded layout. Some APM32 GC01 devices fail normal 3.x USB
        updates. If flashing fails, SWD recovery may be required.
        This package has NOT been run on an actual GC01. Preserve a known-good
        firmware and your instrument settings before considering installation.
        Gameplay physics are an approximation, not original Box2D. A true
        non-monotonic loop is drawn and traversed using a guided model.
        Moving and contact-triggered falling platforms are independently approximated.
        New dynamic platforms and giant saws occur in ordinary generation; full original hazard library remains incomplete.
        Hand-built open-loop, vertical, bowl and jump pieces do not reproduce original game data.
        v2.1 retains the 2/3 world projection and fixed blue/pink palette, adds
        two reference-inspired deck structures, low-speed rail rollback and stronger LCD caching.
        v2.9 retains the v2.8 codec, geometry and physics; requires at least 300 B spare after CRC, with 75 KiB application partition.
        Optional mixed backend uses Clang -Oz; compact mode internalizes host-only APIs and omits the frame pointer.
        Compiler choice and LCD transfer bandwidth may affect timing.
        Compiler settings can affect timing; perceived smoothness must be judged on hardware.
        The game is NOT proven bug-free; actual hardware and radiation pulse timing still require measurement.
        Persistent Rider best/diamonds journal uses the reserved 2KiB save pages;
        writes only on explicit game exit (abrupt power loss may lose records); flash-write impact on
        pulse interrupts is NOT hardware-validated.
        Do not rely on this experimental build for radiation safety decisions.
        TXT
        cat > ../dist/BUILD_AND_TEST_SUMMARY.txt <<'TXT'
        One workflow run produces both firmware candidate and all host test results.
        The signed candidate binary is GC01_RIDER_V29_75K_APM32_DO_NOT_FLASH.bin.
        The tests/ folder contains GCC, Clang, sanitizers, preview, compile and signing logs.
        Includes SOURCE-LEVEL collision and 2:3 visual-alignment regressions.
        The previews/ folder contains 27 320x240 PNG files drawn by the actual C renderer.
        PASS criteria: both host test suites, build, sign, address/CRC/memory audit.
        SOURCE in source/ is the exact engine and renderer tested and compiled.
        NOTE: hardware FPS, bootloader behavior, calibration migration and radiation
        safety cannot be certified by GitHub Actions tests. See READ_BEFORE_FLASHING.txt.
        TXT
        (cd ../dist && sha256sum *.bin *.elf previews/*.png source/*.c source/*.h > SHA256SUMS.txt)
    - name: Verify the ONE combined artifact is complete
      shell: bash
      run: |
        set -euo pipefail
        test -s dist/GC01_RIDER_V29_75K_APM32_DO_NOT_FLASH.bin
        test -s dist/GC01_RIDER_V29_75K_APM32_DIAGNOSTIC.elf
        test -s dist/ADDRESS_AND_MEMORY_AUDIT.txt
        test -s dist/source/test_v11.c
        test -s dist/source/test_reference_repairs.c
        test -s dist/source/test_v12.c
        test -s dist/source/test_v13.c
        test -s dist/source/test_v14.c
        test -s dist/source/test_v15.c
        test -s dist/source/test_v16.c
        test -s dist/source/test_v17.c
        test -s dist/source/test_v18.c
        test -s dist/source/test_v19.c
        test -s dist/source/test_v20.c
        test -s dist/source/test_v21.c
        test -s dist/source/test_lcd_extended.c
        test -s dist/source/render_timing.c
        test -s dist/source/render_run.c
        test -s dist/tests/GCC_TEST_RESULTS.txt
        test -s dist/tests/CLANG_TEST_RESULTS.txt
        test -s dist/tests/PREVIEW_RESULTS.txt
        test -s dist/tests/HOST_RENDER_BENCHMARK.txt
        test -s dist/tests/LOOP_RENDER_BENCHMARK.txt
        test -s dist/tests/PLATFORMIO_BUILD_LOG.txt
        test -s dist/tests/SIGNING_LOG.txt
        test -s dist/tests/LOSSLESS_GCC.txt
        test -s dist/tests/LOSSLESS_CLANG.txt
        test -s dist/tests/COMPACT_LOSSLESS_CLANG.txt
        test -s dist/tests/size/SIZE_RESULTS.tsv
        test -s dist/tests/FLASH_BUDGET.txt
        test -s dist/tests/DATALOG_GCC.txt
        test -s dist/tests/DATALOG_CLANG.txt
        test -s dist/source/datalog_v28.c
        test -s dist/tests/size/SELECTED_PROFILE.txt
        for scene in referencecurl curlexit referencedrop arc gap risegap highgap moving falling giantsaw sawvalley wall bowl perfect ring lift twosaws twopads timedspikes splitbowl slopeup slopedown openloop score spikes triangle detachedbowl; do test -s "dist/previews/$scene.png"; done
        (cd dist && sha256sum -c SHA256SUMS.txt)
        echo 'RIDER_V29: All tests, previews and signed firmware present in the same artifact.'
    - name: Upload only if ALL structural audits pass
      uses: actions/upload-artifact@v4
      with:
        name: GC01-RIDER-V29-75K-ALL-TESTS-DIAGNOSTIC-FIRMWARE
        path: dist/
        if-no-files-found: error
        retention-days: 14
    - name: Upload diagnostics only if a step fails
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: GC01-RIDER-V29-75K-FAILURE-DIAGNOSTICS-NO-FIRMWARE
        path: |
          dist/tests/
          dist/previews/
        if-no-files-found: ignore
        retention-days: 14
    - name: Failure information
      if: failure()
      shell: bash
      run: |
        echo 'No experimental firmware released because a build/audit step failed.'
        if test -f /tmp/rider_expanded_build.log; then tail -n 80 /tmp/rider_expanded_build.log; fi
        if test -f dist/tests/SIGNING_LOG.txt; then tail -n 60 dist/tests/SIGNING_LOG.txt; fi
        if test -f /tmp/rider_expanded_audit.log; then cat /tmp/rider_expanded_audit.log; fi
    - name: Show flash size and build results
      shell: bash
      if: always()
      run: |
        set -euo pipefail
        {
          echo '## GC01 Rider v2.9 75 KiB'
          if test -s dist/tests/size/SIZE_RESULTS.tsv; then
            echo 'Compiler profile results (bytes):'
            echo '```text'
            cat dist/tests/size/SIZE_RESULTS.tsv
            echo '```'
          fi
          if test -s dist/tests/size/SELECTED_PROFILE.txt; then
            cat dist/tests/size/SELECTED_PROFILE.txt
          fi
          if test -s dist/tests/FLASH_BUDGET.txt; then cat dist/tests/FLASH_BUDGET.txt; fi
          echo 'Firmware is diagnostic only; do not flash. If no profile fits, no signed firmware is published.'
        } >> "$GITHUB_STEP_SUMMARY"
'on':
  workflow_dispatch: null
