# EXPERIMENTAL GC01 APM32 Rider 68KiB app / 2KiB saves / 1KiB settings / 41KiB radiation history.
# SELF-CONTAINED: produces a correctly formatted signed APM32 update candidate only if structural checks pass.
# It CANNOT guarantee USB bootloader compatibility, device runtime safety, or preservation of calibration/history.
name: GC01 Rider v0.6 - Test, preview and build firmware (ONE ARTIFACT)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware-candidate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout repository (workflow only is sufficient)
        uses: actions/checkout@v4
      - name: Download pinned Rad Pro 3.1.1 code
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Gissio/radpro.git radpro
          git -C radpro checkout --detach a9d0f19
          test -f radpro/tools/sign.py
