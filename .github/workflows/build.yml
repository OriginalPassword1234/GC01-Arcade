name: GC-01 Arcade V3 Compact - Test and Compile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gc01-v3-apm32:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source and download Rad Pro 3.1.1
        shell: bash
        run: |
          set -euo pipefail

          echo '9cbca040f31651537403c90578593e717bc17d94ba31095608cc9d6ebf719b84  GC01_Arcade_V3_Compact.zip' | sha256sum -c -

          curl --fail --location --retry 3 \
            https://github.com/Gissio/radpro/archive/refs/tags/3.1.1.zip \
            --output /tmp/radpro-3.1.1.zip

          mkdir -p stock results

          unzip -q /tmp/radpro-3.1.1.zip -d stock

          cp -a stock/radpro-3.1.1 radpro-3.1.1

          unzip -qo GC01_Arcade_V3_Compact.zip \
            -d radpro-3.1.1

          test -f radpro-3.1.1/platform.io/src/ui/arcade.c
          test -f radpro-3.1.1/arcade-tests/test_v3_features.c

      - name: Run preservation and regression tests
        shell: bash
        run: |
          set -euo pipefail

          cd radpro-3.1.1

          python arcade-tests/verify_preservation.py \
            ../stock/radpro-3.1.1

          ORIGINAL="$PWD/../stock/radpro-3.1.1" \
            ./arcade-tests/compare_legacy.sh

          ./arcade-tests/run.sh
          ./arcade-tests/run_v3.sh
          ./arcade-tests/run_graphics.sh
          ./arcade-tests/run_dirty.sh

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        shell: bash
        run: |
          python -m pip install --upgrade pip

          python -m pip install 'platformio>=6.1,<7' \
            -r radpro-3.1.1/tools/requirements.txt

      - name: Compile APM32 GC-01 firmware
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p results

          (
            cd radpro-3.1.1/platform.io
            pio run -e fnirsi-gc01_apm32f103rb-en
          ) 2>&1 | tee results/build.log

      - name: Verify flash memory capacity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(
              'radpro-3.1.1/platform.io/.pio/build/'
              'fnirsi-gc01_apm32f103rb-en/firmware.bin'
          )

          size = path.stat().st_size
          maximum = 57340
          remaining = maximum - size

          print("=" * 45)
          print("GC-01 ARCADE V3 COMPACT")
          print("=" * 45)

          print(f"Firmware size: {size:,} bytes")
          print(f"Maximum size: {maximum:,} bytes")
          print(f"Remaining flash: {remaining:,} bytes")

          if remaining < 0:
              raise SystemExit(
                  "FAILED: Firmware exceeds flash limit!"
              )

          print("PASSED: Firmware fits in flash.")

          if remaining < 1024:
              print(
                  "WARNING: Less than 1 KiB of flash remains."
              )

          print("=" * 45)
          PY

      - name: Save firmware and diagnostic files
        if: always()
        shell: bash
        run: |
          mkdir -p results

          DIR=radpro-3.1.1/platform.io/.pio/build/fnirsi-gc01_apm32f103rb-en

          for f in firmware.bin firmware.elf firmware.map; do
            if [ -f "$DIR/$f" ]; then
              cp "$DIR/$f" results/
            fi
          done

          echo "UNVERIFIED BUILD - DO NOT FLASH" \
            > results/DO_NOT_FLASH.txt

          (
            cd results
            sha256sum firmware.bin firmware.elf 2>/dev/null || true
          ) > results/checksums.txt

      - name: Upload compilation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GC01-V3-COMPACT-RAW-UNVERIFIED-DO-NOT-FLASH
          path: results/
          retention-days: 14
