# Self-contained host testing workflow for GC01 Rider v0.5.
# No flashable GC01 firmware is generated by this workflow.
# If Rider source is not in this repository, an exact snapshot of the v0.5
# host-test source is restored from the compressed archive below.
name: "GC01 Rider v0.5 - Self-contained tests and previews (NOT flashable)"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/gc01-rider-v05.yml"

permissions:
  contents: read

jobs:
  test-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find Rider source or restore embedded test snapshot
        shell: bash
        run: |
          set -euo pipefail
          rider_root=""
          while IFS= read -r -d '' f; do
            candidate="${f%/tests/run.sh}"
            if [[ -f "$candidate/src/rider_core.c" && \
                  -f "$candidate/src/rider_render.c" && \
                  -f "$candidate/tests/ppm_to_png.py" && \
                  -f "$candidate/tests/render_saw_preview.c" ]]; then
              rider_root="$candidate"
              break
            fi
          done < <(find . -maxdepth 8 -type f -path '*/tests/run.sh' -print0)
          if [[ -z "$rider_root" ]]; then
            echo "::notice::No complete Rider source tree found; using bundled v0.5 test snapshot."
            rider_root="$RUNNER_TEMP/gc01-rider-v05"
            mkdir -p "$rider_root"
            base64 --decode > "$RUNNER_TEMP/rider-v05-snapshot.zip" <<'RIDER_V05_SNAPSHOT_B64'
