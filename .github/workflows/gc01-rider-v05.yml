name: "GC01 Rider v0.5 - Test and preview (NOT flashable)"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/gc01-rider-v05.yml"
      - "src/**"
      - "tests/**"
      - "gc01_overlay/**"
      - "tools/**"

permissions:
  contents: read

jobs:
  test-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Run core tests with GCC and sanitizers
        run: bash tests/run.sh

      - name: Re-run core tests with Clang and sanitizers
        run: |
          mkdir -p build
          clang -std=c11 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            src/rider_core.c tests/test_core.c -o build/test_core_clang
          ASAN_OPTIONS=detect_leaks=1 ./build/test_core_clang

      - name: Test renderer and RAM budget
        run: |
          mkdir -p build
          cc -std=c11 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            src/rider_core.c src/rider_render.c tests/test_render_many.c \
            -o build/test_render_many
          ASAN_OPTIONS=detect_leaks=1 ./build/test_render_many
          cc -std=c11 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            src/rider_core.c src/rider_render.c tests/render_test.c \
            -o build/render_test
          ASAN_OPTIONS=detect_leaks=1 ./build/render_test build/gameplay.ppm

      - name: Generate gameplay previews from C renderer
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            src/rider_core.c src/rider_render.c tests/render_staged_preview.c \
            -o build/render_staged
          ./build/render_staged build/staged.ppm
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            src/rider_core.c src/rider_render.c tests/render_saw_preview.c \
            -o build/render_saw
          ./build/render_saw build/saw.ppm
          python3 tests/ppm_to_png.py build/gameplay.ppm build/gameplay.png
          python3 tests/ppm_to_png.py build/staged.ppm build/staged.png
          python3 tests/ppm_to_png.py build/saw.ppm build/saw.png

      - name: Save test outputs and preview images (NO firmware)
        uses: actions/upload-artifact@v4
        with:
          name: gc01-rider-v05-host-tests-and-previews-NOT-FIRMWARE
          if-no-files-found: error
          path: |
            build/*.png
            build/*.ppm
            TEST_RESULTS.md
          retention-days: 14
