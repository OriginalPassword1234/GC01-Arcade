      - name: Run core tests (GCC, AddressSanitizer and UBSan)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RIDER_ROOT"
          bash tests/run.sh

      - name: Run core tests (Clang, AddressSanitizer and UBSan)
        shell: bash
        run: |
          set -euo pipefail
          cd "$RIDER_ROOT"
          mkdir -p build
          clang -std=c11 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            src/rider_core.c tests/test_core.c -o build/test_core_clang
          ASAN_OPTIONS=detect_leaks=1 ./build/test_core_clang

      - name: Check renderer, memory, and generated previews
        shell: bash
        run: |
          set -euo pipefail
          cd "$RIDER_ROOT"
          mkdir -p build "$GITHUB_WORKSPACE/rider-test-output"
          cc -std=c11 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            src/rider_core.c src/rider_render.c tests/test_render_many.c \
            -o build/test_render_many
          ASAN_OPTIONS=detect_leaks=1 ./build/test_render_many
          cc -std=c11 -O1 -g -Wall -Wextra -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer \
            src/rider_core.c src/rider_render.c tests/render_test.c \
            -o build/render_test
          ASAN_OPTIONS=detect_leaks=1 ./build/render_test build/gameplay.ppm
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            src/rider_core.c src/rider_render.c tests/render_staged_preview.c \
            -o build/render_staged
          ./build/render_staged build/staged.ppm
          cc -std=c11 -O2 -Wall -Wextra -Werror \
            src/rider_core.c src/rider_render.c tests/render_saw_preview.c \
            -o build/render_saw
          ./build/render_saw build/saw.ppm
          python3 tests/ppm_to_png.py build/gameplay.ppm "$GITHUB_WORKSPACE/rider-test-output/gameplay.png"
          python3 tests/ppm_to_png.py build/staged.ppm "$GITHUB_WORKSPACE/rider-test-output/staged.png"
          python3 tests/ppm_to_png.py build/saw.ppm "$GITHUB_WORKSPACE/rider-test-output/saw.png"
          test "$(find "$GITHUB_WORKSPACE/rider-test-output" -name '*.png' | wc -l)" -eq 3

      - name: Upload preview images (NOT firmware)
        uses: actions/upload-artifact@v4
        with:
          name: gc01-rider-v05-host-tests-and-previews-NOT-FIRMWARE
          if-no-files-found: error
          path: rider-test-output/*.png
          retention-days: 14
