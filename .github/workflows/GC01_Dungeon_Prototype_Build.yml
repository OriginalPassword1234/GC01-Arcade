name: GC-01 Dungeon Gameplay Upgrade 0.3 - test and compile ONLY

on:
  workflow_dispatch:
  push:
    paths:
      - 'GC01_Dungeon_Prototype_Source.zip'
      - '.github/workflows/GC01_Dungeon_Prototype_Build.yml'

permissions:
  contents: read

jobs:
  dungeon-apm32:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify exact audited source overlay and retrieve Rad Pro 3.1.1
        shell: bash
        run: |
          set -euo pipefail
          # Updated SHA-256 is filled in when the reviewed source ZIP is packaged.
          echo '896916ee69572babb710fc2f87395f7ebabec65ada256064fa4e49854050aa9d  GC01_Dungeon_Prototype_Source.zip' | sha256sum -c -
          python - <<'PYZIP'
          import stat
          from pathlib import PurePosixPath
          from zipfile import ZipFile

          expected = {
              'README_DUNGEON_PROTOTYPE_SOURCE_ONLY.md',
              'dungeon-tests/run.sh',
              'dungeon-tests/test_dungeon.c',
              'dungeon-tests/test_regressions.c',
              'dungeon-tests/test_render.c',
              'dungeon-tests/test_features.c',
              'dungeon-tests/verify_firmware.py',
              'dungeon-tests/verify_preservation.py',
              'platform.io/platformio.ini',
              'platform.io/src/extras/arcade.c',
              'platform.io/src/extras/dungeon_logic.c',
              'platform.io/src/extras/dungeon_logic.h',
              'platform.io/src/extras/game.c',
              'platform.io/src/extras/rng.c',
              'platform.io/src/peripherals/keyboard.c',
              'platform.io/src/peripherals/keyboard.h',
              'platform.io/src/system/settings.c',
              'platform.io/src/ui/dungeon_draw.c',
              'platform.io/src/ui/dungeon_draw.h',
              'platform.io/src/ui/game.c',
              'platform.io/src/ui/statistics.c',
              'platform.io/src/ui/view.c',
              'platform.io/src/ui/view.h',
          }
          with ZipFile('GC01_Dungeon_Prototype_Source.zip') as archive:
              entries = archive.infolist()
              names = [item.filename for item in entries]
              if len(names) != len(expected) or set(names) != expected:
                  raise SystemExit('FAIL: ZIP contains unexpected or missing overlay files')
              if len(names) != len(set(names)) or archive.testzip() is not None:
                  raise SystemExit('FAIL: duplicate names or bad ZIP CRC')
              for item in entries:
                  parts = PurePosixPath(item.filename).parts
                  mode = item.external_attr >> 16
                  if (item.is_dir() or item.filename.startswith('/') or
                      '..' in parts or '\\' in item.filename or
                      (mode and not stat.S_ISREG(mode)) or
                      item.file_size > 250000):
                      raise SystemExit('FAIL: unsafe ZIP member: ' + item.filename)
          print('PASS: 23 exact, regular, CRC-checked and path-safe source files')
          PYZIP
          curl --fail --location --retry 3 \
            'https://github.com/Gissio/radpro/archive/refs/tags/3.1.1.zip' \
            --output /tmp/radpro-3.1.1.zip
          mkdir -p stock results
          sha256sum /tmp/radpro-3.1.1.zip | tee results/upstream-source-sha256.txt
          echo 'c998b5bab67c74fe6be2311f94adedbf9a23838c0e040dcc65cf19a87a30cadc  /tmp/radpro-3.1.1.zip' | sha256sum -c -
          unzip -q /tmp/radpro-3.1.1.zip -d stock
          cp -a stock/radpro-3.1.1 radpro-3.1.1
          unzip -qo GC01_Dungeon_Prototype_Source.zip -d radpro-3.1.1
          test -f radpro-3.1.1/platform.io/src/extras/dungeon_logic.c
          test -f radpro-3.1.1/dungeon-tests/test_render.c

      - name: Strict preservation audit and native sanitizer regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          (
            cd radpro-3.1.1
            python dungeon-tests/verify_preservation.py ../stock/radpro-3.1.1
            chmod +x dungeon-tests/run.sh
            ./dungeon-tests/run.sh
          ) 2>&1 | tee results/native-tests.log

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO and Rad Pro dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'platformio>=6.1,<7' \
            -r radpro-3.1.1/tools/requirements.txt

      - name: Compile APM32F103RB English firmware
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          (cd radpro-3.1.1/platform.io && pio run -e fnirsi-gc01_apm32f103rb-en) \
            2>&1 | tee results/build.log

      - name: Check ARM ELF, physical load addresses, RAM and application size
        shell: bash
        run: |
          set -euo pipefail
          build_dir=radpro-3.1.1/platform.io/.pio/build/fnirsi-gc01_apm32f103rb-en
          python radpro-3.1.1/dungeon-tests/verify_firmware.py \
            "$build_dir/firmware.bin" "$build_dir/firmware.elf" \
            2>&1 | tee results/memory-audit.log

      - name: Preserve diagnostics only - never flash this artifact
        if: always()
        shell: bash
        run: |
          mkdir -p results
          build_dir=radpro-3.1.1/platform.io/.pio/build/fnirsi-gc01_apm32f103rb-en
          for f in firmware.elf firmware.bin firmware.map; do
            if [ -f "$build_dir/$f" ]; then cp "$build_dir/$f" "results/$f"; fi
          done
          printf '%s\n' \
            'GC-01 DUNGEON PROTOTYPE - RAW, UNSIGNED, DO NOT FLASH' \
            'NO signed/install.bin firmware is produced by this workflow.' \
            'Compilation and software tests are NOT evidence of safe radiation detection.' \
            'Maintain the known-working firmware for recovery.' \
            > results/DO_NOT_FLASH.txt
          (cd results && sha256sum firmware.bin firmware.elf 2>/dev/null || true) \
            > results/checksums.txt

      - name: Upload diagnostic artifacts (not installable firmware)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GC01-DUNGEON-V03-RAW-UNVERIFIED-DO-NOT-FLASH
          path: results/
          retention-days: 14
