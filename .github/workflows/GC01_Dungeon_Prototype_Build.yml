name: GC-01 Parkour Gauntlet 0.4.5 - build, verify and sign EXPERIMENTAL

on:
  workflow_dispatch:
  push:
    paths:
      - 'GC01_Parkour_V045_Source.zip'
      - '.github/workflows/GC01_Dungeon_Prototype_Build.yml'

permissions:
  contents: read

jobs:
  parkour-apm32:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate exact Parkour 0.4.5 source ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          echo 'Actual ZIP SHA-256:'
          sha256sum GC01_Parkour_V045_Source.zip
          echo '3bdbea3697f62d8cfc8dbeb33475218ff465791f61af21608cc2a707c7d15816  GC01_Parkour_V045_Source.zip' | sha256sum -c -
          python - <<'PYZIP'
          import stat
          from pathlib import PurePosixPath
          from zipfile import ZipFile
          expected = {
              'README_PARKOUR_V045_SOURCE_ONLY.md',
              'parkour-tests/run.sh',
              'parkour-tests/test_logic.c',
              'parkour-tests/test_render.c',
              'parkour-tests/preview.c',
              'parkour-tests/verify_firmware.py',
              'parkour-tests/verify_preservation.py',
              'platform.io/platformio.ini',
              'platform.io/src/extras/arcade.c',
              'platform.io/src/extras/game.c',
              'platform.io/src/extras/parkour_logic.c',
              'platform.io/src/extras/parkour_logic.h',
              'platform.io/src/extras/rng.c',
              'platform.io/src/peripherals/keyboard.c',
              'platform.io/src/peripherals/keyboard.h',
              'platform.io/src/system/settings.c',
              'platform.io/src/ui/draw.c',
              'platform.io/src/ui/draw.h',
              'platform.io/src/ui/game.c',
              'platform.io/src/ui/parkour_art.h',
              'platform.io/src/ui/parkour_draw.c',
              'platform.io/src/ui/parkour_draw.h',
              'platform.io/src/ui/rng.c',
              'platform.io/src/ui/statistics.c',
              'platform.io/src/ui/view.c',
              'platform.io/src/ui/view.h',
          }
          with ZipFile('GC01_Parkour_V045_Source.zip') as z:
              items=z.infolist()
              names=[i.filename for i in items]
              if set(names)!=expected or len(names)!=len(expected):
                  raise SystemExit('FAIL: source ZIP members are not the audited set')
              if z.testzip() is not None:
                  raise SystemExit('FAIL: damaged source ZIP')
              for item in items:
                  path=PurePosixPath(item.filename)
                  mode=item.external_attr>>16
                  if (item.is_dir() or item.filename.startswith('/') or
                      '..' in path.parts or '\\' in item.filename or
                      (mode and not stat.S_ISREG(mode)) or
                      item.file_size>250000):
                      raise SystemExit('FAIL: unsafe ZIP member: '+item.filename)
          print('PASS: 26 verified, safe source-overlay files')
          PYZIP
          sha256sum GC01_Parkour_V045_Source.zip > results/source-checksum.txt

      - name: Obtain verified original Rad Pro 3.1.1 source
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/Gissio/radpro/archive/refs/tags/3.1.1.zip' \
            --output /tmp/radpro-3.1.1.zip
          echo 'c998b5bab67c74fe6be2311f94adedbf9a23838c0e040dcc65cf19a87a30cadc  /tmp/radpro-3.1.1.zip' | sha256sum -c -
          mkdir -p stock
          unzip -q /tmp/radpro-3.1.1.zip -d stock
          cp -a stock/radpro-3.1.1 radpro-3.1.1
          unzip -qo GC01_Parkour_V045_Source.zip -d radpro-3.1.1
          test -f radpro-3.1.1/platform.io/src/extras/parkour_logic.c

      - name: Verify preserved firmware modules and run sanitizer tests
        shell: bash
        run: |
          set -euo pipefail
          (cd radpro-3.1.1 &&
            python parkour-tests/verify_preservation.py ../stock/radpro-3.1.1 &&
            bash parkour-tests/run.sh) 2>&1 | tee results/native-tests.log

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO and original Rad Pro requirements
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install 'platformio>=6.1,<7' -r radpro-3.1.1/tools/requirements.txt

      - name: Cross-compile the full-quality APM32F103RB English target
        shell: bash
        run: |
          set -euo pipefail
          (cd radpro-3.1.1/platform.io &&
            pio run -e fnirsi-gc01_apm32f103rb-en) 2>&1 | tee results/build-full.log

      - name: Keep full-quality game graphics and progressively optimize optional Rad Pro fonts if required
        shell: bash
        run: |
          set -euo pipefail
          b=radpro-3.1.1/platform.io/.pio/build/fnirsi-gc01_apm32f103rb-en
          ini=radpro-3.1.1/platform.io/platformio.ini
          limit=57340
          test -s "$b/firmware.bin"
          current=$(wc -c < "$b/firmware.bin")
          echo "Original UI fonts and full game art: $current / $limit bytes" | tee results/size-comparison.txt
          printf '%s\n' "FULL_GAME_FULL_RADPRO_FONTS" > results/build-variant.txt
          # Never trim game graphics or raise the physical application limit.
          # Upstream 2bpp font alternatives preserve original glyph dimensions;
          # only the appearance of Rad Pro text edges can change.
          for step in symbols large small; do
            if [ "$current" -le "$limit" ]; then break; fi
            echo "Application needs $((current-limit)) additional bytes."
            echo "Optimizing Rad Pro UI $step font; retaining all game art and mechanics."
            python - "$ini" "$step" <<'PYFONT'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1]); step = sys.argv[2]
          options = {
              'symbols': ('FONT_SYMBOLS', 'font_symbols_color.h', 'font_symbols_color_2bpp.h'),
              'large': ('FONT_LARGE', 'font_large_color_115.h', 'font_large_color_115_2bpp.h'),
              'small': ('FONT_SMALL', 'font_small_en_color_21.h', 'font_small_en_color_21_2bpp.h'),
          }
          name, oldfile, newfile = options[step]
          txt = path.read_text()
          section = '[env:fnirsi-gc01_apm32f103rb-en]'
          i = txt.index(section)
          j = txt.find('\n[env:', i + len(section))
          if j < 0: j = len(txt)
          part = txt[i:j]
          old = f"-D{name}='\"fonts/{oldfile}\"'"
          new = f"-D{name}='\"fonts/{newfile}\"'"
          if part.count(old) != 1:
              raise SystemExit(f'Unexpected {name} declaration; refusing unsafe rewrite')
          txt = txt[:i] + part.replace(old,new) + txt[j:]
          path.write_text(txt)
          print(f'Using original upstream {newfile} in the English GC-01 target only')
          PYFONT
            (
              cd radpro-3.1.1/platform.io
              pio run -e fnirsi-gc01_apm32f103rb-en -t clean
              pio run -e fnirsi-gc01_apm32f103rb-en
            ) 2>&1 | tee "results/build-ui-font-$step.log"
            test -s "$b/firmware.bin"
            current=$(wc -c < "$b/firmware.bin")
            echo "After Rad Pro UI $step font optimization: $current bytes" \
              | tee -a results/size-comparison.txt
            echo "RADPRO_FONT_2BPP_$step" >> results/build-variant.txt
          done
          echo "Final raw firmware: $current bytes, free space $((limit-current)) bytes" \
            | tee -a results/size-comparison.txt
          if [ "$current" -gt "$limit" ]; then
            echo "::error::Firmware still exceeds safe flash limit by $((current-limit)) bytes. Refusing to sign."
            exit 1
          fi
          echo 'PASS: complete game, full-resolution sprites, and 3 detailed themes fit.'

      - name: Verify ARM ELF, flash range, vector table, and RAM address bounds
        shell: bash
        run: |
          set -euo pipefail
          b=radpro-3.1.1/platform.io/.pio/build/fnirsi-gc01_apm32f103rb-en
          python radpro-3.1.1/parkour-tests/verify_firmware.py \
            "$b/firmware.bin" "$b/firmware.elf" 2>&1 | tee results/memory-audit.log

      - name: Audit linked chess and optional RNG UI code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          elf=radpro-3.1.1/platform.io/.pio/build/fnirsi-gc01_apm32f103rb-en/firmware.elf
          command -v arm-none-eabi-nm >/dev/null 2>&1 && nm=arm-none-eabi-nm || nm=""
          if [ -z "$nm" ]; then
            nm=$(find "$HOME/.platformio/packages" -type f -name arm-none-eabi-nm -print -quit 2>/dev/null || true)
          fi
          if [ -z "$nm" ]; then
            echo 'ARM symbol tool unavailable; inspect map file manually.' | tee results/dead-code-audit.txt
            exit 0
          fi
          "$nm" -S --size-sort "$elf" > results/arm-symbols.txt
          echo 'Checking whether optional chess and dice UI symbols reached the firmware...' | tee results/dead-code-audit.txt
          if grep -E 'mcumax_|showRNGMenu|drawRNG|onGameStrengthMenu' results/arm-symbols.txt | tee -a results/dead-code-audit.txt; then
            echo 'Unexpected original optional UI code linked; refusing to sign' | tee -a results/dead-code-audit.txt
            exit 1
          fi
          echo 'PASS: original chess engine and optional RNG menu not present in linked symbols.' | tee -a results/dead-code-audit.txt
          echo 'NOTE: pulse-derived RNG remains intentionally enabled for USB data functionality.' | tee -a results/dead-code-audit.txt

      - name: Sign and independently verify experimental install image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release results
          build=radpro-3.1.1/platform.io/.pio/build/fnirsi-gc01_apm32f103rb-en
          raw="$build/firmware.bin"
          elf="$build/firmware.elf"
          test -s "$raw"
          test -s "$elf"
          test -s results/memory-audit.log
          test -s results/build-variant.txt
          # Only reached after source validation, native tests, build, strict
          # 57,340-byte limit and ARM ELF/memory checks have succeeded.
          (cd radpro-3.1.1 && python tools/sign.py) 2>&1 | tee results/sign.log
          signed=radpro-3.1.1/fnirsi-gc01_apm32f103rb/firmware/radpro-fnirsi-gc01_apm32f103rb-en-3.1.1.bin
          test -s "$signed"
          output=release/radpro-fnirsi-gc01_apm32f103rb-en-3.1.1-parkour-v045-EXPERIMENTAL-install.bin
          cp "$signed" "$output"
          # Independently verify target, application content, settings metadata,
          # padding and hardware CRC. Any failure blocks the signed artifact.
          python - "$raw" "$output" <<'PYVERIFY' | tee results/sign-verification.log
          import hashlib
          import struct
          import sys
          from pathlib import Path

          raw = Path(sys.argv[1]).read_bytes()
          signed = Path(sys.argv[2]).read_bytes()
          APP_START = 0x08004000
          APP_CRC = 0x08011FFC
          RAW_LIMIT = APP_CRC - APP_START  # 57,340 bytes
          FOOTER = 0xDFFC
          SIGNED_LENGTH = 0x1C000

          if not 40 <= len(raw) <= RAW_LIMIT:
              raise SystemExit(f'FAIL: invalid raw application size {len(raw)}')
          if len(signed) != SIGNED_LENGTH:
              raise SystemExit(f'FAIL: signed file length {len(signed)} != {SIGNED_LENGTH}')
          stack, reset = struct.unpack_from('<II', raw)
          if stack != 0x20005000 or not (reset & 1):
              raise SystemExit('FAIL: unexpected APM32 stack pointer or Thumb reset vector')
          if not APP_START <= (reset & ~1) < APP_CRC:
              raise SystemExit('FAIL: reset vector outside GC-01 application')
          state_base, state_size = struct.unpack_from('<II', signed, 0x20)
          if (state_base, state_size) != (0x08012000, 0x400):
              raise SystemExit('FAIL: unexpected GC-01 settings metadata')
          if signed[:0x20] != raw[:0x20] or signed[0x28:len(raw)] != raw[0x28:]:
              raise SystemExit('FAIL: signing changed unexpected bytes of compiled application')
          if signed[len(raw):FOOTER] != b'\xff' * (FOOTER - len(raw)):
              raise SystemExit('FAIL: non-FF padding inside unused application flash')
          if signed[0xE000:] != b'\xff' * (len(signed) - 0xE000):
              raise SystemExit('FAIL: unexpected data after application partition')

          # STM32-style CRC, non-reflected poly 0x04C11DB7, initial 0xFFFFFFFF.
          crc = 0xFFFFFFFF
          for offset in range(0, FOOTER, 4):
              crc ^= struct.unpack_from('<I', signed, offset)[0]
              for _ in range(32):
                  crc = ((crc << 1) ^ (0x04C11DB7 if crc & 0x80000000 else 0)) & 0xFFFFFFFF
          stored_crc = struct.unpack_from('<I', signed, FOOTER)[0]
          if stored_crc != crc:
              raise SystemExit(f'FAIL: stored CRC {stored_crc:08x} != calculated CRC {crc:08x}')
          print(f'PASS: raw application {len(raw)}/{RAW_LIMIT} bytes; headroom {RAW_LIMIT-len(raw)}')
          print(f'PASS: install image {len(signed)} bytes, CRC 0x{crc:08x}')
          print('PASS: application payload, vectors, metadata, padding and integrity checks')
          print('Raw SHA-256:', hashlib.sha256(raw).hexdigest())
          print('Signed SHA-256:', hashlib.sha256(signed).hexdigest())
          PYVERIFY
          (cd release && sha256sum *.bin > CHECKSUMS.sha256)
          cp results/build-variant.txt release/BUILD_VARIANT.txt
          cp results/size-comparison.txt release/SIZE_REPORT.txt
          cat > release/READ_ME_FIRST.txt <<'EOF'
          GC-01 PARKOUR GAUNTLET 0.4.5 - SIGNED EXPERIMENTAL INSTALL CANDIDATE

          Target: FNIRSI GC-01 APM32F103RB, English, Rad Pro 3.1.1 base.
          The included file ending in -install.bin has passed source, native
          game tests, ARM memory layout, firmware payload and CRC checks.
          BUILD_VARIANT.txt lists optional upstream Rad Pro UI fonts optimized.
          Game art always remains full-quality; no reduced-game-art fallback.

          This image is experimental and has NOT been tested on your hardware.
          Passing software checks does NOT establish radiation readings,
          alarms, power-management or display correctness. Do NOT rely on
          this experimental firmware for radiation-safety decisions.
          Keep the previously working firmware and a recovery method available.
          Verify hardware operation separately before daily use.
          EOF

      - name: Upload signed experimental install candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GC01-PARKOUR-V045-SIGNED-EXPERIMENTAL-UNTESTED
          path: release/
          if-no-files-found: error
          retention-days: 14

      - name: Collect raw diagnostics (do NOT flash)
        if: always()
        shell: bash
        run: |
          mkdir -p results
          b=radpro-3.1.1/platform.io/.pio/build/fnirsi-gc01_apm32f103rb-en
          for f in firmware.bin firmware.elf firmware.map; do
            if [ -f "$b/$f" ]; then cp "$b/$f" "results/$f"; fi
          done
          printf '%s\n' \
            'EXPERIMENTAL GC-01 PARKOUR 0.4.5 - RAW UNSIGNED DO NOT FLASH' \
            'THIS DIAGNOSTICS ARTIFACT is not installable. A separate signed artifact may exist after success.' \
            'Compilation and software tests do not establish radiation measurement or alarm safety.' \
            'Keep your working firmware and recovery method available.' \
            > results/DO_NOT_FLASH.txt
          (cd results && sha256sum firmware.bin firmware.elf 2>/dev/null || true) > results/binary-checksums.txt

      - name: Upload diagnostics and raw unsigned files (not flashable)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GC01-PARKOUR-V045-RAW-DIAGNOSTICS-DO-NOT-FLASH
          path: results/
          retention-days: 14
