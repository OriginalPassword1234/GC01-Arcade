# EXPERIMENTAL GC01 APM32 Rider 68KiB app / 2KiB saves / 1KiB settings / 41KiB radiation history.
# SELF-CONTAINED: produces a correctly formatted signed APM32 update candidate only if structural checks pass.
# It CANNOT guarantee USB bootloader compatibility, device runtime safety, or preservation of calibration/history.
name: GC01 Rider v0.8 REPAIR 2026-11-21 - ONE artifact (new run)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  firmware-candidate-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout repository (workflow only is sufficient)
        uses: actions/checkout@v4
      - name: Identify NEW v0.8 REPAIR workflow revision
        shell: bash
        run: |
          set -euo pipefail
          echo '=== RIDER_V08_REPAIR_20261121 - FRESH RUN ==='
          echo "Commit: ${GITHUB_SHA}"
          echo "Workflow: ${GITHUB_WORKFLOW}"
          echo "Workflow file: ${GITHUB_WORKFLOW_REF}"
          echo 'If this marker is absent from logs, GitHub is running the OLD workflow.'
          echo 'The correct source location is rider_ci/rider_saves.c (not rider_ci/src/rider_saves.c).'
          echo '=== END VERSION MARKER ==='
      - name: Download pinned Rad Pro 3.1.1 code
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Gissio/radpro.git radpro
          git -C radpro checkout --detach a9d0f19
          test -f radpro/tools/sign.py
