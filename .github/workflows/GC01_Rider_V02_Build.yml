name: GC-01 Rider v0.2 - native tests and ARM diagnostics ONLY

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gc01-rider-v02:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact Rider v0.2 source and retrieve Rad Pro 3.1.1
        shell: bash
        run: |
          set -euo pipefail
          echo '1417f123308c62e24812751018b81af7c7e17c25c0063badf24586d8b40bc0de  GC01_Rider_V02_Source_ONLY.zip' | sha256sum -c -
          curl --fail --location --retry 3 'https://github.com/Gissio/radpro/archive/refs/tags/3.1.1.zip' --output /tmp/radpro-3.1.1-source.zip
          mkdir -p work results
          unzip -q /tmp/radpro-3.1.1-source.zip -d work
          mkdir -p work/radpro-3.1.1
          unzip -qo GC01_Rider_V02_Source_ONLY.zip -d work/radpro-3.1.1
          test -f work/radpro-3.1.1/platform.io/src/extras/rider_core.c
          test -f work/radpro-3.1.1/platform.io/src/ui/rider.c
          grep -q -- '-DFIRMWARE_SIZE=0x11000' work/radpro-3.1.1/platform.io/platformio.ini
          grep -q -- '-DGC01_RIDER' work/radpro-3.1.1/platform.io/platformio.ini
          if grep -q -- '-DRIDER_ENABLE_FLASH_SAVES' work/radpro-3.1.1/platform.io/platformio.ini; then
            echo 'Unsafe: hardware flash-save writes must remain disabled until validation'
            exit 1
          fi
      - name: Native gameplay and journal regression tests
        shell: bash
        run: |
          set -euo pipefail
          (cd work/radpro-3.1.1 && bash tests/run_native.sh) 2>&1 | tee results/native-tests.log
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO for ARM application build
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'platformio>=6.1,<7' -r work/radpro-3.1.1/tools/requirements.txt
      - name: Build English GC-01 APM32F103RB application (not signed)
        shell: bash
        run: |
          set -euo pipefail
          (cd work/radpro-3.1.1/platform.io && pio run -e fnirsi-gc01_apm32f103rb-en) 2>&1 | tee results/arm-build.log
      - name: Validate binary size, partitions and executable metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee results/size-audit.txt
          from pathlib import Path
          import re
          d=Path('work/radpro-3.1.1/platform.io/.pio/build/fnirsi-gc01_apm32f103rb-en')
          binary=d/'firmware.bin'
          size=binary.stat().st_size
          print(f'Raw unsigned code size: {size} bytes')
          print(f'Max application size including 4-byte CRC: 0x11000 = {0x11000} bytes')
          print(f'Max unsigned payload: {0x11000-4} bytes')
          print(f'Provisional remaining bytes: {0x11000-4-size}')
          print('Rider save region: 0x08015000..0x080157FF (2 KiB)')
          print('Settings: 0x08015800..0x08015BFF (1 KiB)')
          print('Measurement logs: 0x08015C00..0x0801FFFF (41 KiB)')
          print('NO BOOTLOADER/REAL-HARDWARE INSTALLATION VALIDATION HAS OCCURRED')
          if size>0x11000-4:
              raise SystemExit('OVERSIZE - DO NOT FLASH')
          PY
      - name: Archive raw development diagnostics, NOT a firmware update
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          d=work/radpro-3.1.1/platform.io/.pio/build/fnirsi-gc01_apm32f103rb-en
          for f in firmware.elf firmware.bin firmware.map; do
            if [ -f "$d/$f" ]; then cp "$d/$f" "results/$f"; fi
          done
          printf '%s\n' 'GC-01 Rider v0.2 DEVELOPMENT DIAGNOSTICS - DO NOT FLASH' \
            'The 68-KiB executable + 2-KiB save pages partition is not validated on this bootloader.' \
            'Live flash-save writes are disabled. Alarm/pulse and LCD timing are not hardware tested.' \
            'firmware.bin is a raw unsigned diagnostic output, not an installation image.' > results/DO_NOT_FLASH.txt
          (cd results && sha256sum firmware.* 2>/dev/null || true) > results/checksums.txt
      - name: Upload diagnostics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GC01-RIDER-V02-RAW-DIAGNOSTICS-DO-NOT-FLASH
          path: results/
          retention-days: 14
