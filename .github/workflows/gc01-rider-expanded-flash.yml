# EXPERIMENTAL GC01 APM32 Rider 68KiB app / 2KiB saves / 1KiB settings / 41KiB radiation history.
# SELF-CONTAINED: no source uploads needed. Deliberately not labelled safe-to-flash.
name: GC01 Rider Expanded Flash - Build and Audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  experimental-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
