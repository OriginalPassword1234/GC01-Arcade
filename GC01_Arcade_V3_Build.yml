name: GC-01 Arcade V3 - test and compile ONLY (DO NOT FLASH)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gc01-v3-apm32:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source overlay
        uses: actions/checkout@v4

      - name: Verify V3 overlay and retrieve exact Rad Pro 3.1.1
        shell: bash
        run: |
          set -euo pipefail
          echo '52841c2a4ccfcec56ad36f9d2cad56e4e4c6a4aaed316695196d45636da9e23e  GC01_Arcade_V3.zip' | sha256sum -c -
          curl --fail --location --retry 3 \
            'https://github.com/Gissio/radpro/archive/refs/tags/3.1.1.zip' \
            --output /tmp/radpro-3.1.1.zip
          mkdir -p stock results
          unzip -q /tmp/radpro-3.1.1.zip -d stock
          cp -a stock/radpro-3.1.1 radpro-3.1.1
          unzip -qo GC01_Arcade_V3.zip -d radpro-3.1.1
          test -f radpro-3.1.1/platform.io/src/ui/arcade.c
          test -f radpro-3.1.1/arcade-tests/test_v3_features.c

      - name: Preservation and game/render/input regression tests
        shell: bash
        run: |
          set -euo pipefail
          cd radpro-3.1.1
          python arcade-tests/verify_preservation.py ../stock/radpro-3.1.1
          ORIGINAL="$PWD/../stock/radpro-3.1.1" ./arcade-tests/compare_legacy.sh
          ./arcade-tests/run.sh
          ./arcade-tests/run_v3.sh
          ./arcade-tests/run_graphics.sh
          ./arcade-tests/run_dirty.sh

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'platformio>=6.1,<7' \
            -r radpro-3.1.1/tools/requirements.txt

      - name: Complete APM32 English firmware build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          (cd radpro-3.1.1/platform.io && pio run -e fnirsi-gc01_apm32f103rb-en) \
            2>&1 | tee results/build.log

      - name: Reject oversized firmware
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('radpro-3.1.1/platform.io/.pio/build/fnirsi-gc01_apm32f103rb-en/firmware.bin')
          size=path.stat().st_size
          remaining=57340-size
          print(f'Unpacked raw firmware bytes: {size}')
          print(f'56 KiB application data limit minus CRC: 57340')
          print(f'Headroom before CRC: {remaining}')
          if remaining<0:
              raise SystemExit('FAIL: too large for signing; DO NOT FLASH')
          print('Raw size fits, but this build is NOT validated for flashing.')
          PY

      - name: Save diagnostics, not a flashable image
        if: always()
        shell: bash
        run: |
          mkdir -p results
          build_dir=radpro-3.1.1/platform.io/.pio/build/fnirsi-gc01_apm32f103rb-en
          for f in firmware.elf firmware.bin firmware.map; do
            if [ -f "$build_dir/$f" ]; then cp "$build_dir/$f" "results/$f"; fi
          done
          printf '%s\n' 'V3 BUILD ARTIFACT - NOT FLASHABLE' \
            'Raw firmware has not been signed; hardware measurements and recovery are unverified.' \
            'DO NOT copy firmware.bin onto the GC-01.' >results/DO_NOT_FLASH.txt
          (cd results && sha256sum firmware.bin firmware.elf 2>/dev/null || true) \
            >results/checksums.txt

      - name: Upload unverified build artifact for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GC01-V3-RAW-UNVERIFIED-DO-NOT-FLASH
          path: results/
          retention-days: 14
